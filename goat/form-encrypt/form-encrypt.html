<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #74b9ff, #ff8c00);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 400px; /* 设置表单宽度 */
      max-width: 100%;
    }

    .login-container h2 {
      color: #333;
      margin-bottom: 20px;
    }

    .login-container label {
      display: block;
      margin-bottom: 5px;
      color: #555;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
      width: calc(100% - 20px); /* 减去padding的宽度 */
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box; /* 确保内边距不影响宽度 */
    }

    .login-container input[type="submit"] {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: linear-gradient(135deg, #74b9ff, #ff8c00);
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .login-container input[type="submit"]:hover {
      opacity: 0.9;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.0.0/crypto-js.min.js"></script>
  <script>
    function calculateMD5(password) {
      return CryptoJS.MD5(password).toString();
    }

    function handleFormSubmit(event) {
      event.preventDefault(); // 阻止表单默认提交行为

      var password = document.getElementById('password').value;
      var sign = calculateMD5(password); // 计算MD5值

      // 创建隐藏的input元素来存储sign
      var signInput = document.createElement('input');
      signInput.type = 'hidden';
      signInput.name = 'sign';
      signInput.value = sign;

      // 将隐藏的input元素添加到表单中
      document.getElementById('loginForm').appendChild(signInput);

      // 提交表单
      document.getElementById('loginForm').submit();
    }
  </script>
</head>
<body>
<div class="login-container">
  <h2>Login Page</h2>

  <!-- 登录表单 -->
  <form id="loginForm" onsubmit="handleFormSubmit(event)">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br>

    <input type="submit" value="Login">
  </form>
</div>
</body>
</html>
